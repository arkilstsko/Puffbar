<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PuffLord – Vape Hustle Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7@8/framework7-bundle.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/framework7-icons@5/framework7-icons.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#080a0f" />
  <link rel="apple-touch-icon" href="icons/pufflord-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }
  </script>
</head>
<body>
  <div id="app" class="framework7-root theme-dark">
    <div class="statusbar"></div>

    <div class="views tabs safe-areas">
      <div id="view-home" class="view view-main tab tab-active" data-name="home">
        <div class="page home-page" data-name="home">
          <div class="page-content" id="home-content">
            <div class="home-hero" id="home-hero"></div>
            <section class="card-grid" id="home-stats"></section>
            <section class="section" id="home-inventory-section">
              <div class="section-header">
                <h2>Backpack</h2>
                <button class="text-link" id="btn-open-warehouse">Warehouse</button>
              </div>
              <div class="list" id="inventory-list"></div>
            </section>
            <section class="section" id="home-log-section">
              <div class="section-header">
                <h2>City Feed</h2>
                <span id="home-risk"></span>
              </div>
              <div class="timeline" id="event-log"></div>
            </section>
          </div>
          <div class="fab fab-end-day" id="fab-end-day">
            <a href="#">
              <i class="icon f7-icons">moon_fill</i>
            </a>
          </div>
        </div>
      </div>

      <div id="view-market" class="view tab" data-name="market">
        <div class="page market-page" data-name="market">
          <div class="page-content" id="market-content">
            <section class="section">
              <div class="section-header">
                <h2>Street Deals</h2>
                <button class="icon-btn" id="btn-market-info" aria-label="Market info">
                  <i class="icon f7-icons">info_circle_fill</i>
                </button>
              </div>
              <div class="virtual-list" id="market-products"></div>
            </section>
            <section class="section" id="warehouse-section">
              <div class="section-header">
                <h2>Warehouse</h2>
                <span id="warehouse-capacity"></span>
              </div>
              <div class="list" id="warehouse-list"></div>
            </section>
          </div>
        </div>
      </div>

      <div id="view-travel" class="view tab" data-name="travel">
        <div class="page travel-page" data-name="travel">
          <div class="page-content" id="travel-content">
            <div class="travel-hero">
              <div class="travel-badge">Current District</div>
              <h1 id="travel-location"></h1>
              <p id="travel-flavor"></p>
              <button class="primary-btn" id="btn-open-travel">Swipe up to travel</button>
            </div>
            <div class="travel-stats" id="travel-stats"></div>
          </div>
        </div>
      </div>

      <div id="view-upgrades" class="view tab" data-name="upgrades">
        <div class="page upgrades-page" data-name="upgrades">
          <div class="page-content" id="upgrades-content">
            <section class="section" id="upgrades-section">
              <div class="section-header">
                <h2>Upgrades</h2>
                <span id="upgrade-points"></span>
              </div>
              <div class="accordion" id="upgrades-list"></div>
            </section>
            <section class="section" id="investments-section">
              <div class="section-header">
                <h2>Investments</h2>
              </div>
              <div class="list" id="investments-list"></div>
            </section>
          </div>
        </div>
      </div>

      <div id="view-quests" class="view tab" data-name="quests">
        <div class="page quests-page" data-name="quests">
          <div class="page-content" id="quests-content">
            <section class="section" id="daily-quests">
              <div class="section-header">
                <h2>Daily Quests</h2>
                <button class="icon-btn" id="btn-quest-refresh" aria-label="Refresh quests">
                  <i class="icon f7-icons">arrow_clockwise</i>
                </button>
              </div>
              <div class="quest-list" id="quests-list"></div>
            </section>
            <section class="section" id="quest-rewards">
              <div class="section-header">
                <h2>Rewards</h2>
              </div>
              <div class="rewards-grid" id="quest-rewards-grid"></div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <div class="toolbar tabbar toolbar-bottom" id="main-tabbar">
      <div class="toolbar-inner">
        <a href="#view-home" class="tab-link tab-link-active" data-tab="home">
          <i class="icon f7-icons">house_fill</i>
          <span>Home</span>
        </a>
        <a href="#view-market" class="tab-link" data-tab="market">
          <i class="icon f7-icons">bag_fill</i>
          <span>Market</span>
        </a>
        <a href="#view-travel" class="tab-link" data-tab="travel">
          <i class="icon f7-icons">map_fill</i>
          <span>Travel</span>
        </a>
        <a href="#view-upgrades" class="tab-link" data-tab="upgrades">
          <i class="icon f7-icons">sparkles</i>
          <span>Upgrades</span>
        </a>
        <a href="#view-quests" class="tab-link" data-tab="quests">
          <i class="icon f7-icons">list_bullet</i>
          <span>Quests</span>
        </a>
      </div>
    </div>

    <div class="sheet-modal sheet-bottom" id="info-sheet">
      <div class="sheet-modal-inner">
        <div class="sheet-modal-handle"></div>
        <div class="sheet-content">
          <h2 id="info-sheet-title"></h2>
          <div id="info-sheet-body"></div>
          <button class="primary-btn" id="info-sheet-close">Got it</button>
        </div>
      </div>
    </div>

    <div class="sheet-modal sheet-bottom sheet-large travel-sheet" id="travel-sheet">
      <div class="sheet-modal-inner">
        <div class="sheet-modal-handle"></div>
        <div class="sheet-content">
          <div class="travel-sheet-header">
            <h2>Select Destination</h2>
            <div id="travel-cost-summary"></div>
          </div>
          <div class="location-cards" id="travel-locations"></div>
          <div class="slide-confirm" id="travel-confirm">
            <span class="slide-label">Slide to travel</span>
            <div class="slide-track">
              <div class="slide-thumb" id="travel-thumb">
                <i class="icon f7-icons">paperplane_fill</i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/framework7@8/framework7-bundle.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
